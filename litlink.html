<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dear</title>
    <style>
        /* 消除所有預設邊距，確保滿版 */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body, html { 
            height: 100%; 
            width: 100%;
            overflow: hidden; /* 防止出現雙重捲軸 */
            background-color: #0d0d0d; 
        }

        /* 滿版嵌入容器 */
        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-line"></div>

    <div class="iframe-container">
        <iframe src="https://lit.link/zh-tw/otkkaori" title="Kuroo Tetsuro Altar"></iframe>
    </div>
<a href="/birthday" style="position:fixed; bottom:10px; right:10px; color:gray; font-size:12px; text-decoration:none;">🎂 慶生倒數</a>

</body>
</html>
