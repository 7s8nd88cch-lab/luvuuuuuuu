<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUROO.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #ffffff;
            color: #888888;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 25px;
            line-height: 1.6;
            min-height: 100vh;
        }
                /* 點點像素 GIF 樣式 */
        .pixel-gif {
            width: 50px; /* 妳可以根據 GIF 的大小調整寬度 */
            height: auto;
            margin-top: 30px;
            image-rendering: pixelated; /* 讓像素圖保持清晰不模糊 */
            opacity: 0.8;
        }


        /* 魔法貓咪區域：確保在手機上也能完美居中 */
        .magic-cat {
            font-family: 'Courier New', Courier, monospace; /* 強制等寬 */
            white-space: pre;
            font-size: 13px; /* 稍微縮小一點點，防止窄螢幕換行 */
            line-height: 1.25;
            color: #b20000;
            margin-bottom: 30px;
            display: block;
            width: fit-content;
        }

        .cat-text {
            font-family: sans-serif;
            font-size: 10px;
            color: #cccccc;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
            text-align: center;
        }

        /* 倒數計時 */
        .timer-box {
            text-align: center;
            margin-bottom: 40px;
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: 300;
            color: #999999;
            letter-spacing: 1.5px;
        }

        /* 自我介紹區 */
        .bio-section {
            max-width: 320px; /* 再稍微縮小一點點，更有集中感 */
            width: 100%;
            border-top: 1px solid #f5f5f5;
            padding-top: 30px;
        }

        .bio-text {
            font-size: 11px; /* 妳要的字再小一點點 */
            color: #999999;
            text-align: justify;
            white-space: pre-wrap;
            opacity: 0.8;
        }

        /* 底部按鈕 */
        .nav-links {
            margin-top: 60px;
            display: flex;
            gap: 20px;
        }

        .link-item {
            text-decoration: none;
            color: #cccccc;
            font-size: 10px;
            letter-spacing: 2px;
            transition: 0.3s;
            border-bottom: 1px solid transparent;
        }

        .link-item:hover {
            color: #b20000;
            border-bottom: 1px solid #b20000;
        }
    </style>
</head>
<body>

    <div class="magic-cat"><span class="cat-text">⭒ birthday countdown</span>
 ⠀⠀/\ 
 ╭ /⠀\ ╮
(ᥩ𓏼︲⩊︲)つ━☆・。 
⊂⠀⠀⠀ノ⠀⠀⠀・゜+. 
しーＪ⠀⠀⠀⠀°。+</div>

    <div class="timer-box">
        <div id="timer" class="timer-display">00d 00h 00m 00s</div>
    </div>

    <div class="bio-section">
        <div class="bio-text">自我介紹一下，日常是學測、追王牛新情報（要開演唱會了嗚呼！）、當阿夢、滑推特。

推特都泡在日區趨勢跟很雜的FA和夢小說，喜歡貼連結來臉書做集中串。貼文幾乎是日常、碎碎念（看我最近迷什麼）、偶爾出去玩也可以隨便標我，我會很開心。

大概就醬平常比較多轉發，愛去留言區玩。有版面潔癖，東西都有分相簿如果想要看ㄉ話私訊只收交易和委託相關ㄉ⋯⋯</div>
    </div>
        <img src="pixel-cat.gif" class="pixel-gif" alt="pixel decor">


    <div class="nav-links">
        <a href="https://lit.link/zh-tw/superotakukaori" class="link-item">LIT.LINK</a>
    </div>

    <script>
        const birthday = new Date("Nov 17, 2026 00:00:00").getTime();
        function updateTimer() {
            const now = new Date().getTime();
            const distance = birthday - now;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            const format = (num) => num.toString().padStart(2, '0');
            document.getElementById("timer").innerHTML = `${d}d ${format(h)}h ${format(m)}m ${format(s)}s`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
