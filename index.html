<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>老公專屬應援站</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('你的照片網址') no-repeat center center fixed; 
            background-size: cover;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid white;
        }
        h1 { color: #ff69b4; text-shadow: 1px 1px 2px white; }
    </style>
</head>
<body>
    <div class="glass-box">
        <h1>❤️ 老公的名字 ❤️</h1>
        <p>這裡是我的專屬小天地</p>
        <p>此網域已由太太宣示主權</p>
    </div>
</body>
</html>
