<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUROO.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #ffffff; /* 白底 */
            color: #888888; /* 灰字 */
            font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 25px;
            line-height: 1.6;
        }

        /* 魔法貓咪區域：確保顏文字不跑版 */
        .magic-cat {
            font-family: monospace; /* 必須用等寬字體 */
            white-space: pre; /* 保留空白格 */
            font-size: 14px;
            line-height: 1.2;
            color: #b20000; /* 給貓咪一點音駒紅 */
            margin-bottom: 30px;
            text-align: left; /* 顏文字通常左對齊才不會散開 */
            width: fit-content;
        }

        /* 倒數計時 */
        .timer-box {
            text-align: center;
            margin-bottom: 40px;
        }

        .timer-display {
            font-size: 1.2rem;
            font-weight: 300;
            color: #aaaaaa;
            letter-spacing: 1px;
        }

        /* 自我介紹區 */
        .bio-section {
            max-width: 350px;
            width: 100%;
            border-top: 1px solid #f0f0f0;
            padding-top: 30px;
        }

        .bio-text {
            font-size: 12px; /* 字體縮小 */
            color: #999999;
            text-align: justify;
            white-space: pre-wrap;
        }

        /* 底部按鈕 */
        .nav-links {
            margin-top: 60px;
            display: flex;
            gap: 20px;
        }

        .link-item {
            text-decoration: none;
            color: #cccccc;
            font-size: 11px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .link-item:hover {
            color: #b20000;
        }
    </style>
</head>
<body>

    <div class="magic-cat">
⠀⭒
 ⠀⠀/\ 
 ╭ /⠀\ ╮
(ᥩ𓏼︲⩊︲)つ━☆・。 
⊂⠀⠀⠀ノ⠀⠀⠀・゜+. 
しーＪ⠀⠀⠀⠀°。+</div>

    <div class="timer-box">
        <div id="timer" class="timer-display">00d 00h 00m 00s</div>
    </div>

    <div class="bio-section">
        <div class="bio-text">
自我介紹一下，日常是學測、追王牛新情報（要開演唱會了嗚呼！）、當阿夢、滑推特。

推特都泡在日區趨勢跟很雜的FA和夢小說，喜歡貼連結來臉書做集中串。貼文幾乎是日常、碎碎念（看我最近迷什麼）、偶爾出去玩也可以隨便標我，我會很開心。

大概就醬平常比較多轉發，愛去留言區玩。有版面潔癖，東西都有分相簿如果想要看ㄉ話私訊只收交易和委託相關ㄉ⋯⋯
        </div>
    </div>

    <div class="nav-links">
        <a href="https://lit.link/zh-tw/superotakukaori" class="link-item">LIT.LINK</a>
        <a href="./birthday.html" class="link-item">COUNTDOWN</a>
    </div>

    <script>
        const birthday = new Date("Nov 17, 2026 00:00:00").getTime();
        function updateTimer() {
            const now = new Date().getTime();
            const distance = birthday - now;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            const format = (num) => num.toString().padStart(2, '0');
            document.getElementById("timer").innerHTML = `${d}d ${format(h)}h ${format(m)}m ${format(s)}s`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
